# Serves data/reports/*.txt (report_day.py's daily plan-vs-actual narrative) for viewing
# from a browser or a Grafana dashboard link. Read-only, LAN-only, no auth - matches how
# the rest of the alphaess-collector stack is exposed.
server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex on;
    default_type text/plain;
}
